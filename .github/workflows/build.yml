name: Build Android AAB + APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the test APK as a release file

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch 3.44.4 $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Flutter pub get check
        run: flutter --version

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/splitcheck.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=$(pwd)/android/splitcheck.jks" >> android/key.properties

      - name: Bump version code
        run: |
          VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          BASE=$(echo $VERSION | cut -d'+' -f1)
          NEW_CODE=${{ github.run_number }}
          sed -i "s/version: .*/version: $BASE+$NEW_CODE/" pubspec.yaml
          echo "New version: $BASE+$NEW_CODE"
      - name: Get dependencies
        run: flutter pub get

      - name: Build AAB
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols --dart-define=GOOGLE_VISION_API_KEY=${{ secrets.GOOGLE_VISION_API_KEY }}

      - name: Rename AAB
        run: |
          mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/splitcheck-v1.0-build${{ github.run_number }}.aab
          ls -lh build/app/outputs/bundle/release/
          echo "AAB ready: splitcheck-v1.0-build${{ github.run_number }}.aab" 

      - name: Upload AAB
        uses: actions/upload-artifact@v6
        with:
          name: splitcheck-v1.0-build${{ github.run_number }}
          path: build/app/outputs/bundle/release/splitcheck-v1.0-build${{ github.run_number }}.aab

      # Installable APK for testing on a phone (signed with the same release key)
      - name: Build APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols --dart-define=GOOGLE_VISION_API_KEY=${{ secrets.GOOGLE_VISION_API_KEY }}

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/splitcheck-v1.0-build${{ github.run_number }}.apk
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: splitcheck-v1.0-build${{ github.run_number }}-apk
          path: build/app/outputs/flutter-apk/splitcheck-v1.0-build${{ github.run_number }}.apk

      # Direct download link for phones: publish the APK as a release file.
      # Each build gets its own pre-release, and "test-latest" always points at the newest one:
      #   https://github.com/<owner>/<repo>/releases/download/test-latest/splitcheck-test.apk
      - name: Publish test APK (direct link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=build/app/outputs/flutter-apk/splitcheck-v1.0-build${{ github.run_number }}.apk
          cp "$APK" splitcheck-test.apk
          NOTES="Test build ${{ github.run_number }} from ${{ github.ref_name }} (${GITHUB_SHA::7})"
          gh release create "test-build-${{ github.run_number }}" "$APK" --prerelease \
            --target "$GITHUB_SHA" --title "Test build ${{ github.run_number }}" --notes "$NOTES"
          gh release delete test-latest --yes --cleanup-tag || true
          gh release create test-latest splitcheck-test.apk --prerelease \
            --target "$GITHUB_SHA" --title "Latest test build" --notes "$NOTES"
