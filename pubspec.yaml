name: splitcheck
description: Fast guided bill-splitting — free, offline-first, EN/AR.
publish_to: none
version: 1.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management — Riverpod 3.3.1 (latest stable July 2026)
  flutter_riverpod: ^3.3.1

  # Local storage — Hive 1.1.0 (lightweight, no server needed)
  hive_flutter: ^1.1.0

  # OCR — Google ML Kit 0.15.0 (free, on-device, English receipts)
  google_mlkit_text_recognition: ^0.15.0

  # Image picker — 1.1.x (security fix for ContentProvider filenames included)
  image_picker: ^1.1.0

  # Voice input — 6.6.2 (free, on-device, EN + AR)
  # speech_to_text: ^7.0.0  # Temporarily disabled - v1 embedding issue

  # Share results via WhatsApp / clipboard / SMS
  share_plus: ^13.0.0
  path_provider: ^2.1.0

  # Localization — English + Arabic RTL support
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Animations
  flutter_animate: ^4.5.0

  # Spacing utility
  gap: ^3.0.1

  # Fonts
  google_fonts: ^6.2.1

  # Unique IDs for bills and people
  uuid: ^4.3.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_launcher_icons: ^0.14.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  generate: true
